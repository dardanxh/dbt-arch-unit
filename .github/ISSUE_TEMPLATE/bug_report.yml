name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands run, relevant `dbt_arch_unit.yaml` snippet, and any model SQL.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dbt-arch-unit version
      description: Output of `dbt-arch-unit version`.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python / dbt version & OS
      placeholder: "Python 3.13, dbt 1.8, macOS 15"
    validations:
      required: false
