name: Release

# Automated versioning + releases via python-semantic-release.
# On every push to main it inspects Conventional Commits since the last tag and,
# if there is a releasable change (feat/fix/perf/BREAKING CHANGE), bumps the
# version, updates CHANGELOG.md, commits, tags vX.Y.Z, and creates a GitHub
# Release. PyPI publishing is gated on the PYPI_PUBLISH repo variable so it stays
# inert until you register a PyPI Trusted Publisher and set PYPI_PUBLISH=true.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit + tag, create the GitHub Release
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Run python-semantic-release directly (not the Docker action) so we can pin
      # gitpython<3.1.45 — 3.1.45 removed Actor.name_email_regex, which current PSR
      # still references (crashes with "type object 'Actor' has no attribute ...").
      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          uvx --with 'gitpython<3.1.45' --from 'python-semantic-release==10.6.1' \
            semantic-release -v version
          after=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          if [ "$before" != "$after" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$after" >> "$GITHUB_OUTPUT"
            echo "Released $after"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release required"
          fi

  publish:
    needs: release
    if: needs.release.outputs.released == 'true' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
