[project]
name = "dbt-arch-unit"
version = "0.1.1"
description = "Architectural unit testing for dbt projects — enforce your team's dbt conventions in CI and pre-commit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dardan Xhymshiti", email = "dardanxhymshiti@gmail.com" }]
keywords = ["dbt", "architecture", "linter", "testing", "data-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/dardanxh/dbt-arch-unit"
Repository = "https://github.com/dardanxh/dbt-arch-unit"
Issues = "https://github.com/dardanxh/dbt-arch-unit/issues"
Changelog = "https://github.com/dardanxh/dbt-arch-unit/blob/main/CHANGELOG.md"

[project.scripts]
dbt-arch-unit = "dbt_arch_unit.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_arch_unit"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The HTML/CSS template contains intentionally long style lines.
"src/dbt_arch_unit/html_report.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Automated versioning & releases driven by Conventional Commits.
# See: https://python-semantic-release.readthedocs.io
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/dbt_arch_unit/__init__.py:__version__"]
# Building is done in the publish job (from the tag), not inside the PSR
# container — so no build command runs here (empty = skip).
build_command = ""
commit_message = "chore(release): v{version} [skip ci]"
tag_format = "v{version}"
allow_zero_version = true

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.branches.main]
match = "main"
